<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Site</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      text-align: center;
    }

    header {
      padding: 60px 20px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2em;
      opacity: 0.9;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: white;
      color: #2a5298;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ddd;
    }

    section {
      padding: 50px 20px;
      background: white;
      color: #333;
    }

    footer {
      padding: 20px;
      font-size: 0.9em;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <header>
    <h1>🚀 Meu Primeiro Site</h1>
    <p>Bem-vindo ao meu espaço na internet</p>
    <a href="#" class="btn">Saiba mais</a>
    <p><a href="sobre.html">Conheça mais sobre mim</a></p>
  </header>

  <section>
    <h2>Sobre mim</h2>
    <p>Estou aprendendo a criar sites e esse é meu primeiro projeto publicado online!</p>
  </section>

  <footer>
    <p>© 2026 - Criado por mim</p>
  </footer>

</body>
</html>
